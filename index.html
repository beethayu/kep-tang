<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <!-- กฎ iOS 26 (จากแอปไร่อ้อย ห้ามเปลี่ยนกลับ): status-bar-style = default, ห้ามมีกล่องเลื่อนได้ใต้แถบสถานะ, ปุ่ม color: inherit -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="เก็บตังค์">
  <meta name="theme-color" content="#0F5257">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>เก็บตังค์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #0F5257; --brand-d: #0A3B3F; --brand-soft: #E1EFEF;
      --ground: #F3F4F1; --card: #FFFFFF; --line: #E1E3DD; --line2: #CDD0C8;
      --ink: #1B2224; --muted: #5B6466; --faint: #8A9294;
      --inc: #1E7B4D; --inc-soft: #E2F2E8;
      --warn: #A85E00; --warn-soft: #FDF0DC;
      --red: #B3261E; --red-soft: #FBE5E3;
      --s-inc: #2a78d6; --s-exp: #eb6834;   /* สีกราฟ: รายรับ / รายจ่าย (ผ่านเช็กตาบอดสี) */
      --s-bar: #2a78d6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: #0F5257; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; background: var(--ground); height: 100%; overflow: hidden; overscroll-behavior: none;
      font-family: 'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif; color: var(--ink); font-size: 16px; line-height: 1.45; }
    #sbar { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #0F5257; z-index: 3000; pointer-events: none; }
    #app { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch; overscroll-behavior: none; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
    button { color: inherit; font-family: inherit; font-size: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px; }

    /* หัว */
    .hd { background: var(--brand); color: #fff; padding: 10px 14px 14px; }
    .hd-in { max-width: 560px; margin: 0 auto; }
    .hd-top { display: flex; align-items: center; gap: 8px; min-height: 36px; }
    .hd-title { font-weight: 700; font-size: 19px; flex: 1; }
    .hd-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: rgba(255,255,255,.12); }
    .mnav { display: flex; align-items: center; gap: 6px; }
    .mnav b { min-width: 92px; text-align: center; font-weight: 600; }
    .big { font-size: 30px; font-weight: 700; letter-spacing: -.5px; margin-top: 4px; }
    .hd-sub { opacity: .8; font-size: 13px; }
    .tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .tri > div { background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 10px; }
    .tri small { display: block; opacity: .8; font-size: 12px; }
    .tri b { font-size: 16px; }

    /* การ์ด / แถว */
    .sec { margin: 16px 0 6px; display: flex; align-items: baseline; justify-content: space-between; }
    .sec h3 { margin: 0; font-size: 15px; color: var(--muted); font-weight: 600; }
    .sec a, .lnk { color: var(--brand); font-size: 14px; font-weight: 600; text-decoration: none; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
    .row:first-child { border-top: 0; }
    .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--ground); display: grid; place-items: center; font-size: 19px; flex: none; }
    .grow { flex: 1; min-width: 0; }
    .t1 { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t2 { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .amt { font-weight: 600; white-space: nowrap; text-align: right; }
    .amt.in { color: var(--inc); }
    .amt.tr { color: var(--muted); }
    .neg { color: var(--red); }
    .day { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 12px 4px 4px; font-weight: 600; }
    .empty { padding: 22px 14px; text-align: center; color: var(--muted); font-size: 14px; }
    .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--ground); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
    .pill.warn { background: var(--warn-soft); color: var(--warn); }
    .pill.red { background: var(--red-soft); color: var(--red); }
    .bar { height: 8px; background: var(--ground); border-radius: 99px; overflow: hidden; margin-top: 6px; }
    .bar > i { display: block; height: 100%; background: var(--s-bar); border-radius: 99px; }
    .bar.over > i { background: var(--red); }
    .bar.near > i { background: var(--warn); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 12px;
      font-weight: 600; background: var(--ground); border: 1px solid var(--line); }
    .btn.pri { background: var(--brand); color: #fff; border-color: var(--brand); }
    .btn.red { color: var(--red); background: #fff; }
    .btn.sm { height: 34px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
    .btn.full { width: 100%; }
    .btn:disabled { opacity: .55; }
    .acts { display: flex; gap: 8px; padding: 0 12px 12px; flex-wrap: wrap; }

    /* แถบล่าง */
    .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; background: #fff; border-top: 1px solid var(--line);
      padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); }
    .bnav button { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; color: var(--faint); padding: 4px 0; }
    .bnav button span { font-size: 21px; line-height: 1.2; filter: grayscale(1); opacity: .75; }
    .bnav button.on { color: var(--brand); font-weight: 600; }
    .bnav button.on span { filter: none; opacity: 1; }

    /* หน้าต่าง (เต็มจอ เริ่มใต้แถบสถานะ) */
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top); z-index: 2000; background: var(--ground);
      display: none; flex-direction: column; }
    .sheet.on { display: flex; }
    .sh-hd { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex: none; }
    .sh-hd b { flex: 1; font-size: 17px; }
    .sh-bd { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 12px 14px calc(24px + env(safe-area-inset-bottom)); }
    .sh-bd > * { max-width: 560px; margin-left: auto; margin-right: auto; }
    .sh-ft { flex: none; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    .sh-ft .btn { flex: 1; }

    /* ฟอร์ม */
    .fld { margin-bottom: 12px; }
    .fld > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .inp { width: 100%; height: 44px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 12px; background: #fff; }
    textarea.inp { height: 70px; padding: 10px 12px; }
    .inp.amtbig { height: 60px; font-size: 30px; font-weight: 700; text-align: right; }
    .seg { display: flex; background: #E6E8E3; border-radius: 12px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; height: 38px; border-radius: 9px; font-weight: 600; color: var(--muted); font-size: 15px; }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line2); background: #fff; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
    .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cgrid button { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 3px 6px; font-size: 12.5px; line-height: 1.25; height: 70px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; overflow: hidden; }
    .cgrid button span { display: block; font-size: 22px; line-height: 1.1; }
    .cgrid button em { font-style: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cgrid button.on { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); font-weight: 600; }
    .two > * { min-width: 0; }
    /* iOS: ช่องวันที่มีความกว้างขั้นต่ำของมันเอง ล้นไปทับช่องข้าง ๆ → บังคับให้พอดีช่อง */
    input[type=date] { -webkit-appearance: none; appearance: none; min-width: 0; max-width: 100%; display: block; background: #fff; }
    input[type=date]::-webkit-date-and-time-value { text-align: left; }
    .flbl { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 2px 6px; }
    .fcard .frow { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-top: 1px solid var(--line); }
    .fcard .frow:first-child { border-top: 0; }
    .fcard .frow span { width: 88px; flex: none; color: var(--muted); font-size: 15px; }
    .fcard .frow input { flex: 1; min-width: 0; border: 0; outline: 0; height: 48px; background: transparent; text-align: right; padding: 0; }
    .fcard .frow input[type=date] { background: transparent; }
    .fcard .frow input[type=date]::-webkit-date-and-time-value { text-align: right; }
    .amtbox { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line2); border-radius: 14px; height: 64px; padding: 0 16px; }
    .amtbox span { font-size: 22px; color: var(--muted); font-weight: 600; }
    .amtbox input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 32px; font-weight: 700; text-align: right; height: 100%; padding: 0; }
    .amtbox.dk { background: rgba(255,255,255,.12); border: 0; margin-top: 12px; height: 72px; }
    .amtbox.dk span { color: rgba(255,255,255,.7); }
    .amtbox.dk input { color: #fff; font-size: 38px; }
    .amtbox.dk input::placeholder { color: rgba(255,255,255,.45); }
    .seg-dk { background: rgba(255,255,255,.12); }
    .seg-dk button { color: rgba(255,255,255,.8); }
    .seg-dk button.on { background: #fff; color: var(--brand); }
    .hd-pill { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px; border-radius: 99px; background: #fff; color: var(--brand); font-weight: 600; font-size: 15px; cursor: pointer; }
    .fcard select { flex: 1; min-width: 0; border: 0; outline: 0; height: 48px; background: transparent; text-align: right; text-align-last: right;
      -webkit-appearance: none; appearance: none; color: var(--ink); padding: 0; }
    .fcard .frow.chk input { flex: none; width: 24px; height: 24px; accent-color: var(--brand); }
    .fcard .frow.chk span { width: auto; flex: 1; color: var(--ink); }
    .fcard .frow.chk small { display: block; color: var(--muted); font-size: 12.5px; }
    .fcard .frow .sfx { width: auto; color: var(--muted); font-size: 14px; }
    .hscroll { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 2px; }
    .hscroll::-webkit-scrollbar { display: none; }
    .hscroll .chip { flex: none; white-space: nowrap; }
    .srch { display: flex; align-items: center; gap: 8px; height: 44px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin: 12px 0 8px; }
    .srch input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
    .more-btn { display: block; width: 100%; margin-top: 6px; height: 36px; color: var(--brand); font-weight: 600; font-size: 14px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tgl { display: flex; align-items: center; gap: 10px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
    .tgl input { width: 22px; height: 22px; accent-color: var(--brand); }
    .note { font-size: 13px; color: var(--muted); }
    .kp { display: flex; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
    .kp:first-child { border-top: 0; }
    .kp-n { width: 24px; height: 24px; border-radius: 99px; background: var(--brand); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; margin-top: 1px; }
    .kp-t { font-size: 15px; }
    .kp-b { font-size: 14px; color: var(--ink, #222); margin-top: 3px; line-height: 1.5; }
    .ib-t { font-size: 17px; font-weight: 700; color: var(--brand-d); }
    .alert { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
    .alert.warn { background: var(--warn-soft); color: #6B3C00; }
    .alert.red { background: var(--red-soft); color: var(--red); }
    .alert.info { background: var(--brand-soft); color: var(--brand-d); }
    .bigbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .bigbtns label, .bigbtns button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 84px; border-radius: 14px;
      background: var(--brand); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
    .bigbtns label.alt, .bigbtns button.alt { background: #fff; color: var(--brand); border: 1px solid var(--line2); }
    .bigbtns span { font-size: 26px; }
    .it { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
    .it .r1 { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 48px; }
    .it .r1 input { border: 0; outline: 0; background: transparent; height: 46px; padding: 0; min-width: 0; }
    .it .r1 input:first-child { flex: 1; }
    .it .r1 input.a { width: 110px; text-align: right; font-weight: 700; font-size: 17px; }
    .it .r2 { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding: 0 4px 0 12px; min-height: 44px; }
    .it .r2 select { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; -webkit-appearance: none; appearance: none; color: var(--muted); font-size: 15px; height: 42px; padding: 0; }
    .it .r2 .xbtn { background: none; }
    .xbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--ground); color: var(--muted); font-size: 18px; flex: none; }
    .photo { width: 100%; max-height: 260px; object-fit: contain; background: #222; border-radius: 12px; display: block; }

    /* กราฟ */
    .chart { padding: 12px; }
    .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .tip { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 4px; text-align: center; }
    .tip b { color: var(--ink); }
    svg text { font-family: inherit; }

    /* toast / โหลด */
    #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: #1B2224; color: #fff;
      padding: 9px 18px; border-radius: 99px; font-size: 15px; z-index: 4000; display: none; max-width: 90%; text-align: center; }
    #busy { position: fixed; inset: 0; background: rgba(15,30,32,.55); z-index: 3500; display: none; place-items: center; }
    #busy div { background: #fff; border-radius: 16px; padding: 18px 22px; text-align: center; max-width: 280px; }
    .spin { width: 34px; height: 34px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .netbar { background: var(--warn-soft); color: #6B3C00; font-size: 14px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
<div id="sbar"></div>
<div id="app"></div>
<nav class="bnav" id="bnav">
  <button data-t="home" onclick="go('home')"><span>🏠</span>หน้าแรก</button>
  <button data-t="list" onclick="go('list')"><span>📒</span>รายการ</button>
  <button data-t="add" onclick="go('add')"><span>📝</span>บันทึก</button>
  <button data-t="sum" onclick="go('sum')"><span>📊</span>สรุป</button>
  <button data-t="more" onclick="go('more')"><span>⚙️</span>ตั้งค่า</button>
</nav>
<div class="sheet" id="sheet"><div class="sh-hd"><b id="shTitle"></b><button class="hd-btn" onclick="closeSheet()">✕</button></div>
  <div class="sh-bd" id="shBody"></div><div class="sh-ft" id="shFoot" style="display:none"></div></div>
<div id="busy"><div><div class="spin"></div><div id="busyMsg">กำลังโหลด…</div></div></div>
<div id="toast"></div>
<input type="file" id="slipFile" accept="image/*" multiple style="position:fixed;left:-9999px;opacity:0;width:1px;height:1px" onchange="onSlipFile(this)">

<script>
// ===== เชื่อมกับ Apps Script =====
const API_URL = 'https://script.google.com/macros/s/AKfycbxMUecwXrdIhbqRj7buAEw8GcHkajsGzAIN2jb3mamkMkS5XSZPzG76qc3uUzPQjj_sDA/exec';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1xM_ZFjzQQpaBy_fjnq4YyIjBE2pxxS4yig6FxXJGAO4/edit';
const KEY_STORE = 'kt_key', DATA_STORE = 'kt_data', UI_STORE = 'kt_ui';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
(function () {
  const m = location.search.match(/[?&]k=([^&]+)/);
  if (m) { lsSet(KEY_STORE, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash); }
})();

function api(fn, args) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), fn === 'readSlip' ? 150000 : 60000);
  return fetch(API_URL, {
    method: 'POST', redirect: 'follow', signal: ctrl.signal,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: fn, args: args || [], k: lsGet(KEY_STORE) || '' })
  })
    .catch(e => { throw new Error(e.name === 'AbortError' ? 'หมดเวลาเชื่อมต่อ สัญญาณอาจอ่อน ลองใหม่' : 'เชื่อมต่อไม่ได้ ตรวจสอบเน็ต'); })
    .then(r => r.json().catch(() => { throw new Error('เซิร์ฟเวอร์ตอบผิดรูปแบบ (สคริปต์อาจยังไม่ได้อนุญาตสิทธิ์)'); }))
    .then(j => {
      if (!j.ok) { const e = new Error(j.error || 'เกิดข้อผิดพลาด'); e.auth = /^AUTH/.test(j.error || ''); e.setup = /^SETUP/.test(j.error || ''); throw e; }
      return j.result;
    })
    .finally(() => clearTimeout(timer));
}
// เรียกแล้วได้ข้อมูลทั้งหมดกลับมา → อัปเดตหน้าจอ
function run(fn, args, msg, after) {
  busy(msg || 'กำลังบันทึก…');
  return api(fn, args).then(d => { busy(false); if (d && d.accounts) setData(d); if (after) after(d); return d; })
    .catch(e => { busy(false); handleErr(e); throw e; });
}
function handleErr(e) {
  if (e.auth) return showKeyBox();
  if (e.setup) return showSetup();
  alert(e.message);
}

// ===== สถานะ =====
let D = null, tab = 'home', curMonth = '', listFilter = { type: 'all', acc: '', q: '' }, sumSel = -1, netErr = '';
let ghostUntil = 0;
const ACC_TYPE = { cash: ['เงินสด', '💵'], bank: ['ธนาคาร', '🏦'], card: ['บัตรเครดิต', '💳'], ewallet: ['e-Wallet', '📱'], farm: ['สำรองจ่ายไร่', '🌾'], other: ['อื่น ๆ', '👛'] };
const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_D = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => { const n = Number(String(x == null ? '' : x).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
function money(n, opt) {
  n = r2(num(n));
  const s = Math.abs(n).toLocaleString('th-TH', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return (n < 0 ? '−' : (opt === '+' && n > 0 ? '+' : '')) + s;
}
function todayIso() { return D && D.today ? D.today : isoOf(new Date()); }
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function thDate(iso, withDay) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return (withDay ? TH_D[dt.getDay()] + ' ' : '') + d + ' ' + TH_M[m - 1] + ' ' + String(y + 543).slice(2);
}
function monthLabel(ym) { const [y, m] = ym.split('-').map(Number); return TH_M[m - 1] + ' ' + String(y + 543).slice(2); }
function shiftMonth(ym, k) { let [y, m] = ym.split('-').map(Number); m += k; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + String(m).padStart(2, '0'); }
const isTrue = x => x === true || String(x).toUpperCase() === 'TRUE';

function setData(d) {
  D = d;
  if (!curMonth) curMonth = d.today.slice(0, 7);
  lsSet(DATA_STORE, JSON.stringify(d));
  if (d.autoPosted) toast('บันทึกรายการประจำอัตโนมัติ ' + d.autoPosted + ' รายการ');
  netErr = '';
  render();
  inboxPump();
}
const accs = (all) => (D.accounts || []).filter(a => all || !isTrue(a.archived)).sort((a, b) => num(a.order) - num(b.order));
const cats = (kind, all) => (D.categories || []).filter(c => (all || !isTrue(c.archived)) && (!kind || (c.kind === 'income') === (kind === 'income')))
  .sort((a, b) => num(a.order) - num(b.order));
const accOf = id => (D.accounts || []).find(a => a.acc_id === id) || { name: '?', type: 'other' };
const catOf = id => (D.categories || []).find(c => c.cat_id === id) || { name: 'ไม่มีหมวด', icon: '❔' };
// จำหมวด: เหมือน ruleKey_/findRule_ ใน gas/Rules.gs (แก้ต้องแก้ทั้งสองที่)
function ruleKey(s) {
  s = String(s || '').toLowerCase().trim();
  s = s.replace(/^(นางสาว|น\.ส\.|ด\.ช\.|ด\.ญ\.)\s*/, '').replace(/^(นาย|นาง|mr|mrs|ms|miss)\.?\s+/, '');
  s = s.replace(/บริษัท|บจก\.?|จำกัด|\(มหาชน\)|มหาชน|co\.?,?\s*ltd\.?/g, '');
  s = s.replace(/x{2,}[\dx\-]*/g, '');
  return s.replace(/[\s.,\-_/\\()'"*:;#&+]+/g, '');
}
function findRule(text, kind) {
  const k = ruleKey(text);
  if (!k) return null;
  const list = (D.rules || []).filter(r => r.key && (r.kind === 'income') === (kind === 'income') && catOf(r.cat_id).cat_id && !isTrue(catOf(r.cat_id).archived));
  const exact = list.find(r => String(r.key) === k);
  if (exact) return exact;
  if (k.length < 4) return null;
  return list.filter(r => String(r.key).length >= 4 && (k.indexOf(r.key) >= 0 || String(r.key).indexOf(k) >= 0))
    .sort((a, b) => String(b.key).length - String(a.key).length)[0] || null;
}

function balance(accId, until) {
  const a = accOf(accId);
  let b = num(a.opening);
  (D.tx || []).forEach(t => {
    if (until && t.date > until) return;
    const v = num(t.amount);
    if (t.acc_id === accId) b += t.type === 'income' || t.type === 'adjust' ? v : -v;
    if (t.type === 'transfer' && t.to_acc_id === accId) b += v;
  });
  return r2(b);
}
function monthTx(ym) { return (D.tx || []).filter(t => String(t.date).slice(0, 7) === ym); }
function sums(list) {
  let inc = 0, exp = 0;
  list.forEach(t => { if (t.type === 'income') inc += num(t.amount); if (t.type === 'expense') exp += num(t.amount); });
  return { inc: r2(inc), exp: r2(exp), net: r2(inc - exp) };
}

function go(t) { tab = t; lsSet(UI_STORE, JSON.stringify({ tab: t, at: Date.now() })); render(); document.getElementById('app').scrollTop = 0; }
function render() {
  document.querySelectorAll('.bnav button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const app = document.getElementById('app');
  if (!D) { app.innerHTML = '<div class="empty" style="padding-top:40vh">กำลังโหลด…</div>'; return; }

  const net = netErr ? `<div class="netbar"><span>⚠️ ${esc(netErr)}</span><button class="btn sm" onclick="load()">ลองใหม่</button></div>` : '';
  app.innerHTML = net + ({ home: homeHtml, list: listHtml, add: addHtml, sum: sumHtml, more: moreHtml }[tab] || homeHtml)();
}

        <div class="grow"><div class="t1">${esc(a.name)}</div><div class="t2">${ACC_TYPE[a.type] ? ACC_TYPE[a.type][0] : ''}${a.type === 'card' && b < 0 ? ' · ค้างจ่าย' : ''}</div></div>

let raiCache = null;
function loadRai() {
  const el = document.getElementById('raiRow'); if (!el) return;
  if (!D.settings || !D.settings.raiKey) return;
  const show = r => {
    const e = document.getElementById('raiRow'); if (!e) return;
    e.innerHTML = r && r.ok ? `<div class="row"><div class="ico">🧾</div><div class="grow"><div class="t1">ตามแอปไร่อ้อย</div>
      <div class="t2">${r.bills ? r.bills + ' บิลยังไม่เบิก' : ''}${r.oldest ? ' · เก่าสุด ' + esc(r.oldest) : ''}</div></div><div class="amt">${money(r.pending)}</div></div>`
      : (r && r.reason === 'auth' ? `<div class="row"><div class="t2">รหัสแอปไร่ไม่ถูก แก้ในตั้งค่า</div></div>` : '');
  };
  if (raiCache && Date.now() - raiCache.at < 600000) return show(raiCache.r);
  api('raiPending').then(r => { raiCache = { r, at: Date.now() }; show(r); }).catch(() => {});
}

// รวมรายการบิลเดียวกันเป็นแถวเดียว
function txSort(a, b) { return a.date === b.date ? (String(a.created_at) < String(b.created_at) ? 1 : -1) : (a.date < b.date ? 1 : -1); }
function groupBills(list) {
  const out = [], seen = {};
  list.forEach(t => {
    if (t.bill_id) {
      if (seen[t.bill_id]) { seen[t.bill_id].items.push(t); return; }
      const g = { bill: true, bill_id: t.bill_id, date: t.date, items: [t] };
      seen[t.bill_id] = g; out.push(g);
    } else out.push(t);
  });
  return out.map(g => g.bill && g.items.length === 1 ? Object.assign({ single: true }, g.items[0]) : g);
}
function txRow(t) {
  if (t.bill) {
    const f = t.items[0], tot = r2(t.items.reduce((s, x) => s + num(x.amount), 0));
    const isInc = t.items.every(x => x.type === 'income');
    return `<button class="row" onclick="openBill('${t.bill_id}')"><div class="ico">🧾</div><div class="grow">
      <div class="t1">${esc(f.shop || 'ใบเสร็จ')} <span class="pill">${t.items.length} รายการ</span></div>
      <div class="t2">${thDate(t.date)} · ${esc(accOf(f.acc_id).name)} · ${esc([...new Set(t.items.map(x => catOf(x.cat_id).name))].join(', '))}</div></div>
      <div class="amt ${isInc ? 'in' : ''}">${isInc ? '+' : ''}${money(tot)}</div></button>`;
  }
  const c = catOf(t.cat_id);
  let icon = c.icon || '❔', title = t.item || t.shop || c.name, sub, cls = '', sign = '';
  if (t.type === 'transfer') { icon = accOf(t.to_acc_id).type === 'farm' ? '🌾' : '🔁'; sub = accOf(t.acc_id).name + ' → ' + accOf(t.to_acc_id).name; cls = 'tr'; title = t.item || 'โอน'; }
  else if (t.type === 'adjust') { icon = '⚖️'; sub = accOf(t.acc_id).name; cls = 'tr'; sign = num(t.amount) > 0 ? '+' : ''; }
  else { sub = (t.item || t.shop ? c.name + ' · ' : '') + accOf(t.acc_id).name; if (t.type === 'income') { cls = 'in'; sign = '+'; } }
  const onclick = t.bill_id ? `openBill('${t.bill_id}')` : `openTx('${t.tx_id}')`;
  return `<button class="row" onclick="${onclick}"><div class="ico">${esc(icon)}</div><div class="grow"><div class="t1">${esc(title)}</div>
    <div class="t2">${tab === 'list' ? '' : thDate(t.date) + ' · '}${esc(sub)}${t.recur_id ? ' · 🔁' : ''}${t.photo_id ? ' · 📷' : ''}</div></div>
    <div class="amt ${cls}">${sign}${money(Math.abs(num(t.amount)))}</div></button>`;
}

// ---------- รายการ ----------
function listHtml() {
  const f = listFilter;
  let list = monthTx(curMonth);
  if (f.type !== 'all') list = list.filter(t => t.type === f.type || (f.type === 'transfer' && t.type === 'adjust'));
  if (f.acc) list = list.filter(t => t.acc_id === f.acc || t.to_acc_id === f.acc);
  if (f.cat) list = list.filter(t => t.cat_id === f.cat);
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => [t.item, t.shop, t.note, catOf(t.cat_id).name].join(' ').toLowerCase().indexOf(q) >= 0); }
  const s = sums(list);
  const byDay = {};
  groupBills(list.sort(txSort)).forEach(t => { (byDay[t.date] = byDay[t.date] || []).push(t); });
  let h = `<div class="hd"><div class="hd-in"><div class="hd-top"><div class="hd-title">รายการ</div>${monthNav()}</div>
    <div class="tri"><div><small>รับ</small><b>${money(s.inc)}</b></div><div><small>จ่าย</small><b>${money(s.exp)}</b></div><div><small>เหลือ</small><b>${money(s.net)}</b></div></div>
    <div class="seg seg-dk" style="margin-top:10px">${[['all', 'ทั้งหมด'], ['expense', 'จ่าย'], ['income', 'รับ'], ['transfer', 'โอน']].map(x =>
      `<button class="${f.type === x[0] ? 'on' : ''}" onclick="listFilter.type='${x[0]}';render()">${x[1]}</button>`).join('')}</div></div></div>
    <div class="wrap"><div class="srch"><span>🔍</span><input type="search" placeholder="ค้นหารายการ ร้าน หมวด" value="${esc(f.q)}" onchange="listFilter.q=this.value;render()">
      ${f.q ? `<button onclick="listFilter.q='';render()" class="t2">✕</button>` : ''}</div>
    <div class="hscroll"><button class="chip ${!f.acc ? 'on' : ''}" onclick="listFilter.acc='';render()">ทุกบัญชี</button>${accs(true).map(a =>
      `<button class="chip ${f.acc === a.acc_id ? 'on' : ''}" onclick="listFilter.acc='${a.acc_id}';render()">${(ACC_TYPE[a.type] || ACC_TYPE.other)[1]} ${esc(a.name)}</button>`).join('')}</div>
    ${f.cat ? `<div style="margin-top:8px"><span class="chip on" onclick="listFilter.cat='';render()">${esc(catOf(f.cat).icon)} ${esc(catOf(f.cat).name)} ✕</span></div>` : ''}`;
  const days = Object.keys(byDay).sort().reverse();
  if (!days.length) h += `<div class="card" style="margin-top:12px"><div class="empty">ไม่มีรายการในเดือนนี้</div></div>`;
  days.forEach(d => {
    const ds = sums(byDay[d].flatMap(t => t.bill ? t.items : [t]));
    h += `<div class="day"><span>${thDate(d, true)}</span><span>${ds.exp ? 'จ่าย ' + money(ds.exp) : ''}${ds.inc ? ' รับ ' + money(ds.inc) : ''}</span></div>
      <div class="card">${byDay[d].map(txRow).join('')}</div>`;
  });
  return h + `<div style="margin-top:14px"><button class="btn full" onclick="exportCsv('month')">⬇️ ส่งออก CSV เดือนนี้</button></div></div>`;
}

// ---------- สรุป ----------
function budgetRows(ym) {
  const mt = monthTx(ym).filter(t => t.type === 'expense');
  return cats('expense', true).filter(c => num(c.budget) > 0 && !isTrue(c.archived)).map(c => {
    const used = r2(mt.filter(t => t.cat_id === c.cat_id).reduce((s, t) => s + num(t.amount), 0));
    return { c, used, budget: num(c.budget), pct: Math.round(used / num(c.budget) * 100) };
  }).sort((a, b) => b.pct - a.pct);
}
function budgetRow(b) {
  const cls = b.pct > 100 ? 'over' : b.pct >= 80 ? 'near' : '';
  return `<button class="row" onclick="openCategory('${b.c.cat_id}')"><div class="ico">${esc(b.c.icon || '📦')}</div><div class="grow">
    <div style="display:flex;justify-content:space-between;gap:8px"><span class="t1">${esc(b.c.name)}${b.pct > 100 ? ' <span class="pill red">⚠️ เกินงบ</span>' : ''}</span>
    <span class="t2">${money(b.used)} / ${money(b.budget)}</span></div>
    <div class="bar ${cls}"><i style="width:${Math.min(100, b.pct)}%"></i></div>
    <div class="t2">${b.pct > 100 ? 'เกิน ' + money(b.used - b.budget) : 'เหลือ ' + money(b.budget - b.used)} (${b.pct}%)</div></div></button>`;
}
function sumHtml() {
  const mt = monthTx(curMonth), s = sums(mt);
  let h = `<div class="hd"><div class="hd-in"><div class="hd-top"><div class="hd-title">สรุป</div>${monthNav()}</div>
    <div class="tri"><div><small>รับ</small><b>${money(s.inc)}</b></div><div><small>จ่าย</small><b>${money(s.exp)}</b></div><div><small>เหลือ</small><b>${money(s.net)}</b></div></div></div></div><div class="wrap">`;

  // กราฟ 6 เดือน รับ/จ่าย
  const months = []; for (let k = 5; k >= 0; k--) months.push(shiftMonth(curMonth, -k));
  const data = months.map(m => Object.assign({ m }, sums(monthTx(m))));
  h += `<div class="sec"><h3>6 เดือนล่าสุด</h3></div><div class="card chart">
    <div class="legend"><span><i style="background:var(--s-inc)"></i>รายรับ</span><span><i style="background:var(--s-exp)"></i>รายจ่าย</span></div>
    ${barChart(data)}<div class="tip" id="tip">${tipText(data[sumSel >= 0 ? sumSel : 5])}</div></div>`;

  // หมวด
  const ex = mt.filter(t => t.type === 'expense');
  const byCat = {};
  ex.forEach(t => byCat[t.cat_id] = (byCat[t.cat_id] || 0) + num(t.amount));
  const rows = Object.keys(byCat).map(id => ({ c: catOf(id), id, v: r2(byCat[id]) })).sort((a, b) => b.v - a.v);
  const max = rows.length ? rows[0].v : 1;
  h += `<div class="sec"><h3>รายจ่ายตามหมวด</h3><span class="note">แตะดูรายการ</span></div><div class="card">` +
    (rows.length ? rows.map(r => {
      const bud = num(r.c.budget);
      return `<button class="row" onclick="listFilter={type:'expense',acc:'',q:'',cat:'${r.id}'};go('list')"><div class="ico">${esc(r.c.icon || '📦')}</div><div class="grow">
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="t1">${esc(r.c.name)}</span><span class="amt">${money(r.v)}</span></div>
        <div class="bar"><i style="width:${Math.max(2, r.v / max * 100)}%"></i></div>
        <div class="t2">${Math.round(r.v / (s.exp || 1) * 100)}% ของรายจ่าย${bud ? ' · งบ ' + money(bud) + (r.v > bud ? ' <span class="pill red">⚠️ เกิน ' + money(r.v - bud) + '</span>' : '') : ''}</div></div></button>`;
    }).join('') : `<div class="empty">ยังไม่มีรายจ่ายเดือนนี้</div>`) + `</div>`;

  // งบ
  const bud = budgetRows(curMonth);
  h += `<div class="sec"><h3>งบรายหมวด</h3><a href="#" onclick="openCategories();return false">ตั้งงบ</a></div><div class="card">` +
    (bud.length ? bud.map(budgetRow).join('') : `<div class="empty">ยังไม่ได้ตั้งงบ — ตั้งค่า → หมวดหมู่และงบ</div>`) + `</div>`;

  // รายรับ
  const inc = mt.filter(t => t.type === 'income'), byI = {};
  inc.forEach(t => byI[t.cat_id] = (byI[t.cat_id] || 0) + num(t.amount));
  const ir = Object.keys(byI).map(id => ({ c: catOf(id), v: r2(byI[id]) })).sort((a, b) => b.v - a.v);
  if (ir.length) h += `<div class="sec"><h3>รายรับตามหมวด</h3></div><div class="card">` + ir.map(r =>
    `<div class="row"><div class="ico">${esc(r.c.icon)}</div><div class="grow t1">${esc(r.c.name)}</div><div class="amt in">+${money(r.v)}</div></div>`).join('') + `</div>`;

  // ตามบัญชี
  const byA = {};
  ex.forEach(t => byA[t.acc_id] = (byA[t.acc_id] || 0) + num(t.amount));
  const ar = Object.keys(byA).map(id => ({ a: accOf(id), v: r2(byA[id]) })).sort((a, b) => b.v - a.v);
  if (ar.length) h += `<div class="sec"><h3>จ่ายจากบัญชีไหน</h3></div><div class="card">` + ar.map(r =>
    `<div class="row"><div class="ico">${(ACC_TYPE[r.a.type] || ACC_TYPE.other)[1]}</div><div class="grow t1">${esc(r.a.name)}</div><div class="amt">${money(r.v)}</div></div>`).join('') + `</div>`;
  return h + `</div>`;
}
function tipText(d) { return d ? `<b>${monthLabel(d.m)}</b> · รับ ${money(d.inc)} · จ่าย ${money(d.exp)} · เหลือ <b>${money(d.net)}</b>` : ''; }
function barChart(data) {
  const W = 340, H = 170, pl = 34, pb = 22, pt = 8, iw = W - pl - 4, ih = H - pb - pt;
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.exp]));
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const y = v => pt + ih - v / top * ih;
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) {
    g += `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#E1E3DD" stroke-width="1"/>
      <text x="${pl - 5}" y="${y(v) + 4}" font-size="10" fill="#5B6466" text-anchor="end">${short(v)}</text>`;
  }
  const gw = iw / data.length, bw = Math.min(16, (gw - 10) / 2);
  data.forEach((d, i) => {
    const cx = pl + gw * i + gw / 2, sel = i === (sumSel >= 0 ? sumSel : data.length - 1);
    if (sel) g += `<rect x="${pl + gw * i + 2}" y="${pt}" width="${gw - 4}" height="${ih}" rx="6" fill="#0F5257" opacity=".06"/>`;
    g += barPath(cx - bw - 1, y(d.inc), bw, pt + ih - y(d.inc), 'var(--s-inc)');
    g += barPath(cx + 1, y(d.exp), bw, pt + ih - y(d.exp), 'var(--s-exp)');
    g += `<text x="${cx}" y="${H - 6}" font-size="11" fill="${sel ? '#1B2224' : '#5B6466'}" font-weight="${sel ? 600 : 400}" text-anchor="middle">${TH_M[Number(d.m.slice(5)) - 1]}</text>
      <rect x="${pl + gw * i}" y="0" width="${gw}" height="${H}" fill="transparent" onclick="sumSel=${i};render()"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="รายรับรายจ่าย 6 เดือน">${g}</svg>`;
}
function barPath(x, y, w, h, fill) {
  if (h <= 0.5) return '';
  const r = Math.min(4, h, w / 2);
  return `<path d="M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z" fill="${fill}"/>`;
}
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function short(v) { return v >= 1e6 ? r2(v / 1e6) + 'ล.' : v >= 1000 ? r2(v / 1000) + 'k' : String(v); }

// ---------- สลิป ----------
let S = null; // ร่างจากสลิป
function shrinkImage(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('เปิดรูปไม่ได้')); };
    img.src = url;
  });
}
// เลือกหลายรูป: ถาม "ใบเดียวกัน (ใบเสร็จยาว)" หรือ "คนละใบ" → คนละใบอ่านทีละใบตามลำดับ
let slipQueue = [];
function onSlipFile(inp) {
  const files = [...(inp.files || [])]; inp.value = '';
  if (!files.length) return;
  const addMode = S && S.addPage;
  if (files.length > 1 && !addMode) {
    const same = confirm(`เลือก ${files.length} รูป\nตกลง = เป็นใบเดียวกัน (ใบเสร็จยาวหลายรูป)\nยกเลิก = คนละใบ (อ่านทีละใบ)`);
    if (!same) { slipQueue = files.slice(1); return readFiles([files[0]]); }
  }
  readFiles(files, addMode);
}
function readFiles(files, addMode) {
  busy('กำลังย่อรูป…');
  Promise.all(files.map(shrinkImage)).then(newPages => {
    const pages = (addMode ? S.pages : []).concat(newPages);
    const ids = addMode && S.photo_id ? S.photo_id.split(',') : [];
    busy(`กำลังอ่านสลิป${slipQueue.length ? ' (เหลืออีก ' + slipQueue.length + ' ใบ)' : ''}… ประมาณ 5–20 วินาที`);
    return api('readSlip', [pages, 'image/jpeg', { photo_ids: ids }]).then(d => {
      busy(false);
      S = Object.assign(d, { pages, thumb: newPages[0] && !addMode ? newPages[0] : (S && S.thumb) });
      if (!S.items || !S.items.length) S.items = [{ item: '', amount: S.total || '', cat_id: '' }];
      S.items.forEach(it => { if (it.ruled) it.ruledCat = it.cat_id; });
      if (!S.acc_id) S.acc_id = lastAcc();
      renderSlip();
    });
  }).catch(e => { busy(false); handleErr(e); });
}
function renderSlip() {
  const ty = S.type === 'income' ? 'income' : 'expense';
  const sum = r2(S.items.reduce((s, it) => s + num(it.amount), 0));
  let h = '';

function readSlipForm() {
  const g = id => { const e = document.getElementById(id); return e ? e.value : undefined; };
  if (g('sDate') !== undefined) S.date = g('sDate');
  if (g('sShop') !== undefined) S.shop = g('sShop');
  S.items.forEach((it, i) => {
    if (g('si_n' + i) !== undefined) it.item = g('si_n' + i);
    if (g('si_a' + i) !== undefined) it.amount = g('si_a' + i);
    if (g('si_c' + i) !== undefined) it.cat_id = g('si_c' + i);
  });
}
function mergeSlip() {
  readSlipForm();
  const by = {};
  S.items.forEach(it => { by[it.cat_id] = by[it.cat_id] || { amount: 0, n: [] }; by[it.cat_id].amount += num(it.amount); by[it.cat_id].n.push(it.item); });
  const keys = Object.keys(by);
  // หมวดเดียว = ยอดเดียว / หลายหมวด = บรรทัดละหมวด
  S.items = keys.map(k => ({ cat_id: k, amount: r2(by[k].amount), item: by[k].n.length > 1 ? (catOf(k).name !== 'ไม่มีหมวด' ? catOf(k).name : 'รวม') + ' ' + by[k].n.length + ' รายการ' : by[k].n[0] }));
  renderSlip();
}
function saveSlip() {
  readSlipForm();
  const items = S.items.filter(it => num(it.amount));
  if (!items.length) return alert('ยังไม่มีจำนวนเงิน');
  if (!S.farm && items.some(it => num(it.amount) > 0 && !it.cat_id)) return alert('เลือกหมวดให้ครบทุกบรรทัด');
  if (!S.acc_id) return alert('เลือกบัญชี');
  if (S.dupe && !S.edit && !confirm('อาจลงซ้ำกับรายการเดิม บันทึกต่อไหม?')) return;
  const b = { bill_id: S.edit || '', inbox_id: S.inbox_id || '', date: S.date, acc_id: S.acc_id, shop: S.shop, ref: S.ref, photo_id: S.photo_id, farm: S.farm,
    items: items.map(it => ({ item: it.item, amount: num(it.amount), cat_id: it.cat_id, type: S.type === 'income' ? 'income' : 'expense' })) };
  run('saveBill', [b], 'กำลังบันทึก…', () => {
    const fromInbox = S.inbox_id; S = null; closeSheet(); toast('บันทึกแล้ว');
    if (fromInbox) return nextInbox();
    if (slipQueue.length) { const f = slipQueue.shift(); setTimeout(() => readFiles([f]), 300); }
  });
}
function cancelSlip() {
  if (!S) return closeSheet();
  if (S.inbox_id) {
    if (!confirm('ทิ้งสลิปนี้? (ไม่บันทึก รูปจะถูกลบ)')) return;
    const id = S.inbox_id; S = null;
    return run('discardInbox', [id], 'กำลังทิ้ง…', () => { closeSheet(); toast('ทิ้งแล้ว'); nextInbox(); });
  }
  if (!S.edit) {
    if (!confirm('ยกเลิกสลิปนี้? (รูปจะถูกทิ้ง)')) return;
    if (S.photo_id) api('discardSlip', [S.photo_id]).catch(() => {});
  }
  S = null; slipQueue = []; closeSheet();
}

      ${sure.length < list.length ? `<div class="note" style="margin-top:6px">ที่มีป้าย "ตรวจ" แตะทีละใบ (หมวด/บัญชีไม่แน่ใจ หรืออาจซ้ำ)</div>` : ''}</div>` : '') + `</div>`;

// ทยอยอ่านสลิปที่ยังไม่ได้อ่าน ทีละ 2 ใบ (เบื้องหลัง ไม่บังจอ)
function inboxPump() {
  if (!D || !D.inbox) return;
  const todo = D.inbox.filter(x => !inboxBusy[x.in_id] && (x.status === 'new' || (x.status === 'error' && !inboxTried[x.in_id])));
  const slots = 2 - Object.keys(inboxBusy).length;
  todo.slice(0, Math.max(0, slots)).forEach(x => {
    inboxBusy[x.in_id] = 1; inboxTried[x.in_id] = 1;
    api('readInbox', [x.in_id]).then(r => {
      delete inboxBusy[x.in_id];
      const i = (D.inbox || []).findIndex(y => y.in_id === x.in_id);
      if (r && r.in_id && i >= 0) D.inbox[i] = r;
      lsSet(DATA_STORE, JSON.stringify(D));
      if (tab === 'home' && !document.getElementById('sheet').classList.contains('on')) {
        const y = document.getElementById('app').scrollTop; render(); document.getElementById('app').scrollTop = y;
      }
      inboxPump();
    }).catch(() => { delete inboxBusy[x.in_id]; });
  });
}
function openInbox(id) {
  const x = (D.inbox || []).find(y => y.in_id === id); if (!x) return;
  if (x.status === 'new' || x.status === 'reading') return toast('กำลังอ่าน รอสักครู่');
  S = x.status === 'ready' && x.data ? JSON.parse(JSON.stringify(x.data)) :
    { error: x.err || 'อ่านไม่ได้', date: String(x.taken).slice(0, 10), shop: '', type: 'expense', total: 0, items: [] };
  Object.assign(S, { inbox_id: id, photo_id: x.photo_id, pages: [], thumb: null });
  if (!S.items || !S.items.length) S.items = [{ item: '', amount: S.total || '', cat_id: '' }];
  S.items.forEach(it => { if (it.ruled) it.ruledCat = it.cat_id; });
  if (!S.acc_id) S.acc_id = (accs().find(a => a.type === 'bank') || {}).acc_id || lastAcc();
  renderSlip();
  const pid = x.photo_id;
  api('getPhoto', [pid, 0]).then(p => {
    if (!S || S.photo_id !== pid) return;
    S.thumb = p.b64; S.thumbMime = p.mime;
    const box = document.getElementById('sThumb');
    if (box) box.innerHTML = `<img class="photo" src="data:${p.mime};base64,${p.b64}" onclick="this.style.maxHeight=this.style.maxHeight?'':'none'"><p class="note" style="text-align:center;margin:4px 0 10px">แตะรูปเพื่อขยาย</p>`;
  }).catch(() => {});
}
function nextInbox() {
  const n = inboxList().find(x => x.status === 'ready' || x.status === 'error');
  if (n) setTimeout(() => openInbox(n.in_id), 300);
}
function confirmSure() {
  const ids = inboxList().filter(x => x.status === 'ready' && x.data && x.data.sure).map(x => x.in_id);
  if (!ids.length) return;
  if (!confirm('บันทึก ' + ids.length + ' ใบตามที่ AI อ่าน?')) return;
  run('confirmInbox', [ids], 'กำลังบันทึก ' + ids.length + ' ใบ…', d => toast('บันทึกแล้ว ' + (d.confirmed || 0) + ' ใบ'));
}

// ---------- ดูบิล ----------
function openBill(id) {
  const items = (D.tx || []).filter(t => t.bill_id === id);
  if (!items.length) return;
  const f = items[0], tot = r2(items.reduce((s, x) => s + num(x.amount), 0));
  const farm = items.length === 1 && f.type === 'transfer';
  let h = `<div class="card"><div class="row"><div class="grow"><div class="t1">${esc(f.shop || 'ใบเสร็จ')}</div>
    <div class="t2">${thDate(f.date, true)} · ${esc(accOf(f.acc_id).name)}${f.ref ? ' · อ้างอิง ' + esc(f.ref) : ''}</div></div><div class="amt">${money(tot)}</div></div>` +
    items.map(t => `<div class="row"><div class="ico">${farm ? '🌾' : esc(catOf(t.cat_id).icon)}</div><div class="grow"><div class="t1">${esc(t.item || '-')}</div>
      <div class="t2">${farm ? 'ค่าไร่ (สำรองจ่าย)' : esc(catOf(t.cat_id).name)}${t.note ? ' · ' + esc(t.note) : ''}</div></div><div class="amt">${money(t.amount)}</div></div>`).join('') + `</div>`;
  if (f.photo_id) h += `<button class="btn full" style="margin-top:12px" onclick="showPhoto('${f.photo_id}')">📷 ดูรูปสลิป</button>`;
  const foot = `<button class="btn red" style="flex:0 0 auto" onclick="delBill('${id}')">ลบ</button><button class="btn pri" onclick="editBill('${id}')">✏️ แก้</button>`;
  openSheet('ใบเสร็จ', h, foot);
}
function editBill(id) {
  const items = (D.tx || []).filter(t => t.bill_id === id), f = items[0];
  const farm = items.length === 1 && f.type === 'transfer' && accOf(f.to_acc_id).type === 'farm';
  S = { edit: id, date: f.date, shop: f.shop, acc_id: f.acc_id, ref: f.ref, photo_id: f.photo_id, farm, type: f.type === 'income' ? 'income' : 'expense',
    items: items.map(t => ({ item: farm ? String(t.item).replace(/^ค่าไร่:?\s*/, '') : t.item, amount: num(t.amount), cat_id: t.cat_id })) };
  renderSlip();
}
function delBill(id) {
  if (!confirm('ลบใบเสร็จนี้ทั้งใบ (และรูป)?')) return;
  run('deleteBill', [id], 'กำลังลบ…', () => { closeSheet(); toast('ลบแล้ว'); });
}
function showPhoto(ids) {
  const list = String(ids).split(',');
  busy('กำลังโหลดรูป…');
  Promise.all(list.map((_, i) => api('getPhoto', [ids, i]))).then(ps => {
    busy(false);
    const back = document.getElementById('shBody').innerHTML, t = document.getElementById('shTitle').textContent, ft = document.getElementById('shFoot').innerHTML;
    openSheet('รูปสลิป', ps.map(p => `<img class="photo" style="max-height:none;margin-bottom:8px" src="data:${p.mime};base64,${p.b64}">`).join(''),
      `<button class="btn" id="phBack">‹ กลับ</button>`);
    document.getElementById('phBack').onclick = () => openSheet(t, back, ft);
  }).catch(e => { busy(false); handleErr(e); });
}

function saveAcc(id) {

  run('adjustBalance', [id, num(real), cur, todayIso()], 'กำลังปรับยอด…', () => { closeSheet(); toast('ปรับยอดแล้ว'); });

function delAcc(id) {

// ---------- หมวดที่จำไว้ ----------
function openRules() {
  const list = (D.rules || []).slice().sort((a, b) => String(a.updated_at) < String(b.updated_at) ? 1 : -1);
  const h = list.length ? `<div class="card">${list.map(r => { const c = catOf(r.cat_id); return `<div class="row"><div class="ico">${esc(c.icon || '📦')}</div>
    <div class="grow"><div class="t1">${esc(r.name)}</div><div class="t2">→ ${esc(c.name)}${num(r.hits) > 1 ? ' · ลงแล้ว ' + num(r.hits) + ' ครั้ง' : ''}</div></div>

function delRule(key) {

}
function moveCat(id, k) {
  const c = catOf(id), list = cats(c.kind, true).map(x => x.cat_id), i = list.indexOf(id);
  if (i + k < 0) return;
  list.splice(i, 1); list.splice(i + k, 0, id);
  const all = list.concat(cats(c.kind === 'income' ? 'expense' : 'income', true).map(x => x.cat_id));
  run('reorderCategories', [all], 'กำลังจัดเรียง…', () => openCategories());
}

function saveCat(id) {
  const v = x => document.getElementById(x).value;

function delCat(id) {
  if (!confirm('ลบหมวดนี้? (ถ้ามีรายการแล้วจะซ่อนแทน)')) return;

// ---------- รายการประจำ ----------
const FREQ = { monthly: 'ทุกเดือน', weekly: 'ทุกสัปดาห์', yearly: 'ทุกปี' };
function openRecurrings() {
  const list = (D.recurring || []).slice().sort((a, b) => a.next_date < b.next_date ? -1 : 1);
  const h = (list.length ? `<div class="card">${list.map(r => `<button class="row" onclick="openRecurring('${r.rec_id}')"><div class="ico">${r.type === 'transfer' ? '🔁' : esc(catOf(r.cat_id).icon)}</div>
    <div class="grow"><div class="t1">${esc(r.name)}${isTrue(r.auto) ? ' <span class="pill">อัตโนมัติ</span>' : ''}${r.active === false || String(r.active) === 'FALSE' ? ' <span class="pill">ปิด</span>' : ''}</div>
    <div class="t2">${FREQ[r.freq] || ''} · ครั้งต่อไป ${thDate(r.next_date)} · ${esc(accOf(r.acc_id).name)}</div></div><div class="amt ${r.type === 'income' ? 'in' : ''}">${money(r.amount)}</div></button>`).join('')}</div>`
    : `<div class="card"><div class="empty">ยังไม่มีรายการประจำ<br>เช่น ค่าเน็ต ค่าโทรศัพท์ ค่าประกัน เงินเดือน</div></div>`) +
    `<p class="note">อัตโนมัติ = ลงให้เองเมื่อถึงวัน (ยอดเท่าเดิมทุกเดือน) · ไม่อัตโนมัติ = ขึ้นเตือนหน้าแรกให้กดบันทึก แก้ยอดได้ (เช่น ค่าไฟ)</p>`;
  openSheet('รายการประจำ', h, `<button class="btn pri" onclick="openRecurring('')">＋ เพิ่มรายการประจำ</button>`);
}
let R = null;
function openRecurring(id) {
  const t = todayIso();
  R = id ? Object.assign({}, (D.recurring || []).find(x => x.rec_id === id)) :
    { name: '', type: 'expense', amount: '', acc_id: lastAcc(), to_acc_id: '', cat_id: '', freq: 'monthly', day: Number(t.slice(8)), next_date: t, auto: false, active: true };
  R.auto = isTrue(R.auto); R.active = !(R.active === false || String(R.active) === 'FALSE');
  renderRecurring();
}
function renderRecurring() {
  const ty = R.type;
  const accOpts = sel => accs().map(a => `<option value="${a.acc_id}" ${sel === a.acc_id ? 'selected' : ''}>${esc(a.name)}</option>`).join('');
  let h = `<div class="seg">${[['expense', 'รายจ่าย'], ['income', 'รายรับ'], ['transfer', 'โอน']].map(x =>
    `<button class="${ty === x[0] ? 'on' : ''}" onclick="readRec();R.type='${x[0]}';R.cat_id='';renderRecurring()">${x[1]}</button>`).join('')}</div>
    <div class="flbl">รายการ</div><div class="card fcard">
    ${fr('ชื่อ', `<input id="rName" value="${esc(R.name)}" placeholder="เช่น ค่าเน็ตบ้าน">`)}
    ${fr('จำนวนเงิน', `<input id="rAmt" inputmode="decimal" value="${esc(R.amount)}" placeholder="0">`)}
    ${ty !== 'transfer' ? fr('หมวด', `<select id="rCat"><option value="">— เลือก —</option>${cats(ty).map(c => `<option value="${c.cat_id}" ${R.cat_id === c.cat_id ? 'selected' : ''}>${esc(c.icon)} ${esc(c.name)}</option>`).join('')}</select>`) : ''}
    ${fr(ty === 'income' ? 'เข้าบัญชี' : 'จากบัญชี', `<select id="rAcc">${accOpts(R.acc_id)}</select>`)}
    ${ty === 'transfer' ? fr('ไปบัญชี', `<select id="rTo"><option value="">— เลือก —</option>${accOpts(R.to_acc_id)}</select>`) : ''}</div>
    <div class="flbl">รอบ</div><div class="card fcard">
    ${fr('ความถี่', `<select id="rFreq">${Object.keys(FREQ).map(k => `<option value="${k}" ${R.freq === k ? 'selected' : ''}>${FREQ[k]}</option>`).join('')}</select>`)}
    ${fr('ครั้งต่อไป', `<input type="date" id="rNext" value="${esc(R.next_date)}">`)}
    ${chk('rAuto', R.auto, 'ลงให้อัตโนมัติ', 'ถึงวันแล้วบันทึกเอง (ยอดเท่าเดิมทุกรอบ)')}
    ${chk('rAct', R.active, 'เปิดใช้งาน')}</div>
    <p class="note">ไม่อัตโนมัติ = ขึ้นเตือนหน้าแรกให้กดบันทึก แก้ยอดได้ (เหมาะกับค่าไฟ ค่าน้ำ)</p>`;
  const foot = (R.rec_id ? `<button class="btn red" style="flex:0 0 auto" onclick="delRec()">ลบ</button>` : '') + `<button class="btn pri" onclick="saveRec()">บันทึก</button>`;
  openSheet(R.rec_id ? 'แก้รายการประจำ' : 'เพิ่มรายการประจำ', h, foot);
}
function readRec() {
  const g = id => { const e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : undefined; };
  [['rName', 'name'], ['rAmt', 'amount'], ['rCat', 'cat_id'], ['rAcc', 'acc_id'], ['rTo', 'to_acc_id'], ['rFreq', 'freq'], ['rNext', 'next_date'], ['rAuto', 'auto'], ['rAct', 'active']]
    .forEach(([i, k]) => { const v = g(i); if (v !== undefined) R[k] = v; });
}
function saveRec() {
  readRec();
  if (!R.name) return alert('ใส่ชื่อ');
  if (!num(R.amount)) return alert('ใส่จำนวนเงิน');
  if (R.type !== 'transfer' && !R.cat_id) return alert('เลือกหมวด');
  if (R.type === 'transfer' && (!R.to_acc_id || R.to_acc_id === R.acc_id)) return alert('เลือกบัญชีปลายทาง');
  const d = R.next_date.split('-');
  R.day = R.freq === 'weekly' ? new Date(+d[0], d[1] - 1, +d[2]).getDay() : R.freq === 'yearly' ? d[1] + '-' + d[2] : Number(d[2]);
  run('saveRecurring', [R], 'กำลังบันทึก…', () => { toast('บันทึกแล้ว'); openRecurrings(); });
}
function delRec() {
  if (!confirm('ลบรายการประจำนี้? (รายการที่ลงไปแล้วยังอยู่)')) return;
  run('deleteRecurring', [R.rec_id], 'กำลังลบ…', () => openRecurrings());
}
function postDue(id, ask) {
  const r = (D.due || []).find(x => x.rec_id === id); if (!r) return;
  let amt = r.amount;
  if (ask) { const v = prompt(`${r.name} — ยอดรอบนี้ (บาท)`, r.amount); if (v === null) return; amt = num(v); if (!amt) return; }
  run('postRecurring', [id, amt, r.next_date, r.acc_id], 'กำลังบันทึก…', () => toast('บันทึกแล้ว'));
}
function skipDue(id) { if (confirm('ข้ามรอบนี้ (ไม่บันทึก)?')) run('skipRecurring', [id], 'กำลังข้าม…'); }

// ---------- CSV ----------
function exportCsv(range) {
  const t = todayIso();
  let list = (D.tx || []).slice();
  let name = 'ทั้งหมด';
  if (range === 'month') { list = monthTx(curMonth); name = curMonth; }
  if (range === 'year') { list = list.filter(x => String(x.date).slice(0, 4) === t.slice(0, 4)); name = t.slice(0, 4); }
  list.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const TY = { expense: 'รายจ่าย', income: 'รายรับ', transfer: 'โอน', adjust: 'ปรับยอด' };
  const head = ['วันที่', 'วันที่ (พ.ศ.)', 'ประเภท', 'บัญชี', 'ไปบัญชี', 'หมวด', 'รายการ', 'ร้าน', 'จำนวนเงิน', 'รับ/จ่าย (+/−)', 'หมายเหตุ', 'เลขอ้างอิง'];
  const q = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = list.map(x => {
    const a = num(x.amount);
    const signed = x.type === 'expense' ? -a : x.type === 'income' || x.type === 'adjust' ? a : 0;
    const [y, m, d] = String(x.date).split('-');
    return [x.date, `${+d}/${+m}/${+y + 543}`, TY[x.type] || x.type, accOf(x.acc_id).name, x.to_acc_id ? accOf(x.to_acc_id).name : '',
      x.cat_id ? catOf(x.cat_id).name : '', x.item, x.shop, Math.abs(a), signed, x.note, x.ref].map(q).join(',');
  });
  const csv = '﻿' + head.join(',') + '\n' + rows.join('\n');
  const fname = `เก็บตังค์_${name}.csv`;
  const file = new File([csv], fname, { type: 'text/csv' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: fname }).catch(() => {});
  } else {
    const u = URL.createObjectURL(file), a = document.createElement('a');
    a.href = u; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  }
}

// ---------- รหัส / ตั้งค่าเชื่อมต่อ ----------
function showKeyBox() {
  openSheet('ใส่รหัสเข้าแอป', `<div class="fld"><label>รหัสที่ตั้งไว้ตอนเปิดใช้ครั้งแรก</label><input class="inp" id="kIn" type="password" autocomplete="current-password"></div>`,
    `<button class="btn pri" onclick="lsSet(KEY_STORE,document.getElementById('kIn').value);closeSheet();load(true)">เข้าแอป</button>`);
}
function showSetup() {
  openSheet('เริ่มใช้เก็บตังค์', `<div class="alert info">ตั้งครั้งเดียว ข้อมูลเก็บใน Google Sheets ของบัญชี bee.prettyboy</div>
    <div class="fld"><label>ตั้งรหัสเข้าแอป (จำไว้ ใช้ตอนเปิดในเครื่องใหม่)</label><input class="inp" id="suKey" autocomplete="new-password"></div>
    <div class="fld"><label>รหัส Gemini (อ่านสลิป) — ใส่ทีหลังได้</label><input class="inp" id="suGem" placeholder="AQ.… หรือ AIza…"></div>
    <p class="note">ก๊อปรหัส Gemini ได้จาก Apps Script แอปไร่อ้อย → ⚙️ ตั้งค่าโปรเจกต์ → คุณสมบัติของสคริปต์ → GEMINI_KEY</p>`,
    `<button class="btn pri" onclick="doSetup()">เริ่มใช้</button>`);
}
function doSetup() {
  const k = document.getElementById('suKey').value.trim(), g = document.getElementById('suGem').value.trim();
  if (k.length < 4) return alert('รหัสอย่างน้อย 4 ตัว');
  lsSet(KEY_STORE, k);
  run('initSetup', [k, g], 'กำลังสร้างชีต…', () => { closeSheet(); toast('พร้อมใช้แล้ว'); });
}
function openGemini() {
  openSheet('รหัส Gemini', `<div class="fld"><label>วางรหัส (ขึ้นต้น AQ. หรือ AIza)</label><input class="inp" id="gIn"></div>
    <p class="note">ใช้ตัวเดียวกับแอปไร่อ้อยได้ (Apps Script ไร่ → ⚙️ → คุณสมบัติของสคริปต์ → GEMINI_KEY) หรือ aistudio.google.com/apikey</p>`,
    `<button class="btn pri" onclick="saveGemini()">บันทึก</button>`);
}
function saveGemini() {
  const k = document.getElementById('gIn').value.trim();
  busy('กำลังเช็กรหัส…');
  api('setGeminiKey', [k]).then(r => { busy(false); if (r && r.ok) { D.settings.gemini = true; closeSheet(); toast('✅ รหัสใช้ได้'); render(); } else alert('รหัสใช้ไม่ได้ (' + (r && r.code) + ')'); })
    .catch(e => { busy(false); handleErr(e); });
}
function openRaiKey() {
  openSheet('รหัสแอปไร่อ้อย', `<div class="fld"><label>รหัส API ของแอปไร่ (ตัวเดียวกับที่ใช้เปิดแอปไร่)</label><input class="inp" id="rkIn"></div>
    <p class="note">ใช้ดึงยอด "รอเบิกจากไร่" มาโชว์ที่หน้าแรก — ตัวเลขจะขึ้นเมื่อแอปไร่ทำเรื่องเบิกเงินเสร็จ</p>`,
    `<button class="btn pri" onclick="saveRaiKey()">บันทึก</button>`);
}
function saveRaiKey() {
  run('setRaiKey', [document.getElementById('rkIn').value], 'กำลังบันทึก…', r => { D.settings.raiKey = true; raiCache = null; closeSheet(); toast(r && r.reason === 'auth' ? 'รหัสแอปไร่ไม่ถูก' : 'บันทึกแล้ว'); render(); });
}
function openChangeKey() {
  openSheet('เปลี่ยนรหัสเข้าแอป', `<div class="fld"><label>รหัสใหม่</label><input class="inp" id="nkIn"></div>
    <p class="note">เครื่องอื่นที่เคยเปิดจะต้องใส่รหัสใหม่</p>`, `<button class="btn pri" onclick="changeKey()">เปลี่ยน</button>`);
}
function changeKey() {
  const k = document.getElementById('nkIn').value.trim();
  if (k.length < 4) return alert('อย่างน้อย 4 ตัว');
  run('changeApiKey', [k], 'กำลังเปลี่ยน…', () => { lsSet(KEY_STORE, k); closeSheet(); toast('เปลี่ยนรหัสแล้ว'); });
}

// ===== เริ่ม =====
function load(force) {
  if (force) busy('กำลังโหลด…');
  api('getAll').then(d => { busy(false); setData(d); })
    .catch(e => {
      busy(false);
      if (e.auth || e.setup) return handleErr(e);
      netErr = e.message; render();
    });
}
(function init() {
  try {
    const ui = JSON.parse(lsGet(UI_STORE) || '{}');
    if (ui.tab && Date.now() - ui.at < 6 * 3600e3) tab = ui.tab;
  } catch (e) {}
  try { const c = JSON.parse(lsGet(DATA_STORE) || 'null'); if (c && c.accounts) { D = c; curMonth = isoOf(new Date()).slice(0, 7); } } catch (e) {}
  render();
  load();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D && !document.getElementById('sheet').classList.contains('on')) load(); });
})();
</script>
